[project]
name = "tutti"
version = "0.1.0"
description = "Exam Simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pyrefly]
search-path = ["backend"]

[tool.ruff]
fix = true
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "EM",
  "FA",
  "G",
  "INT",
  "PIE",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "SLOT",
  "T10",
  "YTT",
  "DTZ",
  "I",
  "ISC",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP"
]
fixable = ["ALL"]
ignore = [
  "EM101",
  "EM102",
  "ISC001",
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
